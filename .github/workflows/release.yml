name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Każdy item generuje 2 ZIPy (self-contained + framework-dependent).
        # Subiekt GT jest wyłącznie 32-bit (cała linia produktów InsERT "GT").
        # In-proc COM wymaga że bit-level Bridge pasuje do Subiekta - dlatego tylko x86.
        # (Subiekt Nexo to osobny produkt, x64, ale nie targetujemy go.)
        rid: [win-x86]
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish self-contained (${{ matrix.rid }})
        run: |
          dotnet publish src/SubiektBridge.Api/SubiektBridge.Api.csproj \
            -c Release -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false \
            -p:Version=${{ steps.ver.outputs.version }} \
            -o publish/${{ matrix.rid }}-selfcontained

      - name: Publish framework-dependent (${{ matrix.rid }})
        run: |
          dotnet publish src/SubiektBridge.Api/SubiektBridge.Api.csproj \
            -c Release -r ${{ matrix.rid }} \
            --self-contained false \
            -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false \
            -p:Version=${{ steps.ver.outputs.version }} \
            -o publish/${{ matrix.rid }}-fxdep

      - name: Bundle deploy artifacts
        run: |
          cat > /tmp/appsettings.Production.json.template <<'JSON'
          {
            "//token": "Wygeneruj losowy 64+ znaków, ten sam wpisz w .env klienta Laravel jako SUBIEKT_BRIDGE_TOKEN",
            "Logging": { "LogLevel": { "Default": "Information", "Microsoft.AspNetCore": "Warning" } },
            "Kestrel": {
              "Endpoints": {
                "Https": {
                  "Url": "https://0.0.0.0:988",
                  "Certificate": {
                    "Path": "data/cert.pfx",
                    "Password": "subiekt-bridge-self-signed"
                  }
                }
              }
            },
            "Bridge": {
              "Token": "WSTAW-LOSOWY-64-ZNAKOWY-TOKEN",
              "UseFakeSfera": false,
              "AllowedRawSferaMethods": [],
              "IdempotencyStorePath": "C:\\SubiektBridge\\data\\idempotency.db"
            },
            "Subiekt": {
              "Product": 1,
              "Authentication": 0,
              "Server": ".\\SQLEXPRESS",
              "Database": "MAGAZYN",
              "DbUser": "subiekt-user",
              "DbPassword": "WSTAW-HASLO-DO-MSSQL",
              "Operator": "INTEGRACJA",
              "OperatorPassword": "WSTAW-HASLO-OPERATORA-SUBIEKTA",
              "PdfTemplateId": null,
              "Encoding": "windows-1250"
            }
          }
          JSON

          for variant in selfcontained fxdep; do
            dir="publish/${{ matrix.rid }}-${variant}"
            cp deploy/install-windows.ps1 "$dir/"
            cp deploy/update-windows.ps1 "$dir/"
            cp deploy/update-bridge.ps1 "$dir/"
            cp /tmp/appsettings.Production.json.template "$dir/"
            rm -f "$dir/appsettings.Development.json"
          done

          du -sh publish/${{ matrix.rid }}-selfcontained publish/${{ matrix.rid }}-fxdep

      - name: Create ZIPs
        run: |
          VERSION=${{ steps.ver.outputs.version }}
          RID=${{ matrix.rid }}

          (cd publish && mv ${RID}-selfcontained ${RID} && \
            zip -qr "../SubiektBridge-${VERSION}-${RID}.zip" ${RID} && \
            mv ${RID} ${RID}-selfcontained)

          (cd publish && mv ${RID}-fxdep ${RID} && \
            zip -qr "../SubiektBridge-${VERSION}-${RID}-fxdep.zip" ${RID} && \
            mv ${RID} ${RID}-fxdep)

          ls -lh SubiektBridge-${VERSION}-${RID}*.zip

      - name: Compute SHA256
        run: |
          VERSION=${{ steps.ver.outputs.version }}
          RID=${{ matrix.rid }}
          for f in SubiektBridge-${VERSION}-${RID}.zip SubiektBridge-${VERSION}-${RID}-fxdep.zip; do
            sha256sum "$f" > "${f}.sha256"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: |
            SubiektBridge-*.zip
            SubiektBridge-*.zip.sha256
          retention-days: 1

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      # Checkout tylko po to, by odczytac opis (annotation) taga - to on jest changelogiem dla integratorow.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Determine version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Release notes (opis taga + szablon)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git fetch --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" 2>/dev/null || true
          {
            echo "## Zmiany"
            echo
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" | sed -e '1s/^/**/' -e '1s/$/**/'
            echo
            echo "Kontrakt API dla integratorów (z historią zmian): [docs/INTEGRATION-CONTRACT.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/INTEGRATION-CONTRACT.md)"
            echo
            sed "s/__VERSION__/${VERSION}/g" .github/release-notes-template.md
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: SubiektBridge ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          body_path: release-notes.md
          files: |
            dist/SubiektBridge-*.zip
            dist/SubiektBridge-*.zip.sha256
