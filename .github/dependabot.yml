# Cotygodniowe PR-y z aktualizacjami zależności. Minor/patch zgrupowane w jeden PR na ekosystem;
# major idą osobno (breaking changes do przejrzenia - np. SqlClient 6 -> 7 wydzielił Azure).
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      nuget-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
